[package]
name = "monsterbook"
version = "1.0.0"
edition = "2021"
default-run = "monsterbook-cli"

[[bin]]
name = "monsterbook-cli"
path = "src/cli.rs"
required-features = ["cli"]

[[bin]]
name = "monsterbook-gui"
path = "src/gui.rs"
required-features = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# https://stackoverflow.com/questions/35711044/how-can-i-specify-binary-only-dependencies

[features]
default = ["cli", "gui"]
cli = ["dep:clap"]
gui = ["dep:eframe", "dep:rfd", "dep:arboard"]

[dependencies]
image = "0.23.14"
rustfft = "6.0.1"
nshare = "0.8.0"
ndarray = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
clap = { version = "3.2", features = ["derive"], optional = true }

eframe = { version = "0.16.0", optional = true }
rfd = { version = "0.6.3", optional = true }
arboard = { version = "3", optional = true }
